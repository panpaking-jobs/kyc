<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Comments Section</title>
    <!-- Font Awesome CDN for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>happy Customer</h2>

  <!-- Reviews Section (Visible only on Home Page) -->
  <div id="comments-section"></div>

  <div class="add-comment-box">
    <input type="text" id="commentInput" placeholder="Add a comment..." />
    <i class="fas fa-paper-plane" id="sendBtn"></i>
  </div>
  <div class="emoji-box">
    <span class="emoji">🔥</span>
    <span class="emoji">❤️</span>
    <span class="emoji">😂</span>
    <span class="emoji">👍</span>
    <span class="emoji">✨</span>
    <span class="emoji">💕</span>
    <span class="emoji">🤣</span>
    <span class="emoji">😱</span>
  </div>

  <script>
      const commentInput = document.getElementById('commentInput');
      const commentsSection = document.getElementById('comments-section');
    
      const profileLinks = {
        "gopikasuresh8694": "https://www.youtube.com/@gopikasuresh8694",
        "ManojDey": "https://www.youtube.com/@ManojDey",
        "GyanTherapy": "https://www.youtube.com/@GyanTherapy",
        "TechnicalYogi": "https://www.youtube.com/@TechnicalYogi",
        "vmusictune": "https://www.youtube.com/@vmusictune",
        "kettavan666": "https://www.youtube.com/@kettavan666",
        "CoolMitra": "https://www.youtube.com/@CoolMitra",
        "Algrow": "https://www.youtube.com/@Algrow"
      };
    
      const profileImages = {
        "gopikasuresh8694": "@gopikasuresh8694.jpg",
        "ManojDey": "@ManojDey.jpg",
        "GyanTherapy": "@GyanTherapy.jpg",
        "TechnicalYogi": "@TechnicalYogi.jpg",
        "vmusictune": "@vmusictune.jpg",
        "kettavan666": "@kettavan666.jpg",
        "CoolMitra": "@CoolMitra.jpg",
        "Algrow": "@Algrow.jpg"
      };
    
      const commentsData = [
        { username: "gopikasuresh8694", text: "भैया आप लोगों का बहुत-बहुत धन्यवाद जिसकी वजह से मैं आज महीने का 31000 कमा पा रही हु। 😍💖" },
        { username: "ManojDey", text: "jobs ki service sabse acchi hai maine khud se Kiya hai" },
        { username: "GyanTherapy", text: "Bhaiya aise hi Kam karte rahana bahut achcha kam kar rahe ho 💖" },
        { username: "TechnicalYogi", text: "Aap sabhi ko suggest karta hun Banda trusted hai" },
        { username: "vmusictune", text: "Kaafi fast id mili mujhe." },
        { username: "kettavan666", text: "मुझे भी आप लोगों की तरह शक हो रहा था लेकिन काफी अच्छा बंदा है" },
        { username: "CoolMitra", text: "सबसे अच्छी job मिल रही है इनकी" },
        { username: "Algrow", text: "You can trust him completely, he is a great guy" }
      ];

    
      function renderComments() {
        commentsSection.innerHTML = '';
        commentsData.forEach(data => {
          const commentDiv = document.createElement('div');
          commentDiv.className = 'comment-box';
          commentDiv.innerHTML = `
            <img src="${profileImages[data.username]}" alt="${data.username}">
            <div class="comment-content">
              <a href="${profileLinks[data.username]}" class="username" target="_blank">@${data.username}</a>
              <p class="comment-text">${data.text}</p>
              <div class="comment-actions">
                <i class="fas fa-thumbs-up like-btn"></i>
                <i class="fas fa-reply reply-btn" data-user="${data.username}"></i>
                <div class="three-dots">
                  <i class="fas fa-ellipsis-v"></i>
                  <div class="menu">
                    <a href="${profileLinks[data.username]}" target="_blank">Visit profile</a>
                  </div>
                </div>
              </div>
            </div>
          `;
          commentsSection.appendChild(commentDiv);
        });
    
        document.querySelectorAll('.like-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            btn.classList.toggle('liked');
          });
        });
    
        document.querySelectorAll('.reply-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const user = btn.getAttribute('data-user');
            commentInput.value = `@${user} `;
            commentInput.focus();
          });
        });
      }
    
      document.getElementById('sendBtn').addEventListener('click', () => {
        if (commentInput.value.trim() === '') return;
        alert("Pehle aapko service book karni padegi yahan se.");
        commentInput.value = '';
      });
    
      document.querySelectorAll('.emoji').forEach(e => {
        e.addEventListener('click', () => {
          commentInput.value += e.textContent;
          commentInput.focus();
        });
      });
    
      renderComments();
    </script>
    

</body>
</html>
